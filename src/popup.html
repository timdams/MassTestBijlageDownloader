<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            width: 200px;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
        }

        h3 {
            margin-top: 0;
            font-size: 16px;
            color: #333;
        }

        #status {
            margin: 16px 0;
            font-size: 14px;
            color: #666;
        }

        button {
            background-color: #2196F3;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }

        button:disabled {
            background-color: #ccc;
            cursor: default;
        }

        button:hover:not(:disabled) {
            background-color: #1976D2;
        }
    </style>
</head>

<body>
    <h3>Zip Downloader</h3>
    <div id="status">Scanning...</div>
    <button id="downloadBtn" disabled>Download All</button>
    <script src="popup.js"></script>
</body>

</html>
